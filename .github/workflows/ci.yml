name: Verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-14
    steps:
      # Pinned to the commit currently served by the official v5 tag.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Run unit tests
        run: swift test
      - name: Audit public release content
        run: zsh Scripts/audit-public-release.sh
